# Bosanda — http{}-level shared state (PLAN.md §16, §18)
#
# Install to /etc/nginx/conf.d/00-bosanda-http.conf. The `00-` prefix matters:
# `upstream`, `map`, and `log_format` must be defined before the server blocks in
# sites-enabled reference them, and the stock Ubuntu nginx.conf includes conf.d
# before sites-enabled.
#
# Nothing here terminates a request. It declares only state that is genuinely
# shared by all three vhosts.
#
# NOTE ON SCOPE: rate-limit and connection zones are deliberately NOT declared
# here. Each vhost owns its own zones, because the correct rate for a token
# stream, a storefront page, and an admin report have nothing to do with each
# other. Declaring a zone in two files is a fatal nginx config error
# ("limit_conn_zone ... is already bound"), so keep the ownership boundary sharp:
# zones live in sites-available/<vhost>.conf, never here.

# ---------------------------------------------------------------------------
# Upstreams
# ---------------------------------------------------------------------------
# Ports match packages/config/src/env.ts (GATEWAY_PORT default 4000) bound to
# GATEWAY_HOST=127.0.0.1, so no Node process is reachable from the internet
# except through nginx (§16: "Internal PostgreSQL is not publicly reachable" —
# the same reasoning applies to every app port).
#
# `keepalive` holds idle upstream connections open. Without it nginx opens a
# fresh TCP connection per request, adding a handshake to every turn; on the
# streaming vhost that lands directly on time-to-first-token. Keepalive only
# actually engages because snippets/bosanda-proxy-common.conf sets
# `proxy_set_header Connection ""` — see the comment there.
#
# max_fails=0 disables passive health marking. With exactly ONE backend per
# upstream, marking it "down" after 3 errors converts a transient blip into a
# hard outage for fail_timeout seconds and there is nowhere to fail over TO.
# Health is judged by systemd and scripts/healthcheck.sh, not by nginx guessing.
upstream bosanda_gateway {
    server 127.0.0.1:4000 max_fails=0 fail_timeout=0;
    keepalive 64;
}

upstream bosanda_web {
    server 127.0.0.1:3000 max_fails=0 fail_timeout=0;
    keepalive 16;
}

upstream bosanda_admin {
    server 127.0.0.1:3001 max_fails=0 fail_timeout=0;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# Rate-limit response status
# ---------------------------------------------------------------------------
# Return 429 rather than nginx's default 503. In the Bosanda error taxonomy
# (PLAN.md §8) 503 means "no provider capacity / adapter disabled" and 429 means
# "rate, concurrency, or quota limit". SDK clients back off differently for the
# two, so the edge must not mislabel shedding as an upstream outage.
limit_req_status 429;
limit_conn_status 429;

# Log rejections so the playbooks in docs/incident-response.md can tell
# "edge shed it" apart from "the gateway returned 429".
limit_req_log_level warn;
limit_conn_log_level warn;

# ---------------------------------------------------------------------------
# Access log format
# ---------------------------------------------------------------------------
# Deliberately absent (PLAN.md §16 privacy, §17 redaction): request bodies,
# Authorization, x-api-key, and Cookie. Bosanda accepts credentials in HEADERS
# only; if a client ever puts a key in a query string it would land in $uri, so
# treat any such sighting as a credential exposure (docs/incident-response.md,
# "Credential compromise").
#
# $uri rather than $request: $uri is the normalized path WITHOUT the query
# string, which keeps stray query parameters out of the log entirely.
#
# On the streaming vhost $upstream_response_time measures time to the LAST byte,
# so it tracks whole-turn duration; $upstream_header_time is the edge-side
# proxy for TTFB. §17 wants both.
log_format bosanda escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"request_id":"$http_x_request_id",'
    '"user_agent":"$http_user_agent"'
    '}';

# Buffered access logging: flush every 5s or 64k. The alternative on a streaming
# vhost is a synchronous disk write at the end of every long turn.
access_log /var/log/nginx/bosanda-access.log bosanda buffer=64k flush=5s;

# ---------------------------------------------------------------------------
# Global hygiene
# ---------------------------------------------------------------------------
# Do not advertise the nginx patch version (§16: do not volunteer internal
# identity). Complete removal of the Server header needs the headers-more module.
server_tokens off;

# Slowloris protection. These are intentionally SHORT even for the streaming
# vhost: slow HEADERS are never legitimate. Only slow RESPONSES are, and those
# are governed by proxy_read_timeout, a different directive entirely.
client_header_timeout 15s;
client_body_timeout 30s;

# Idle client connection reuse. A long-lived stream is active, not idle, so this
# does not truncate streams.
keepalive_timeout 65s;
keepalive_requests 1000;
