# Bosanda — shared TLS parameters (PLAN.md §16 "Network", §18)
#
# Included by every server block AFTER its ssl_certificate lines. Certificates
# are issued by certbot in `certonly` mode (see deploy/nginx/README.md) so that
# certbot never rewrites these hand-audited server blocks.
#
# WHY TLSv1.2 as the floor and not TLSv1.3-only: Bosanda's clients are SDKs and
# CLIs (OpenAI SDK, Anthropic SDK, Claude Code) running on machines we do not
# control, including older Node and Python builds. TLSv1.3-only would reject
# some of them with an opaque handshake error that looks like a Bosanda outage.
# TLSv1.0/1.1 are off: they are deprecated and offer nothing we need.
ssl_protocols TLSv1.2 TLSv1.3;

# Forward-secret AEAD suites only. No CBC, no RSA key transport, no 3DES.
# TLSv1.3 suites are negotiated separately and are all AEAD+PFS already.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# WHY off: letting the client choose lets it pick ChaCha20 on mobile/ARM where
# it is faster than AES-GCM. Every suite in the list above is acceptable, so
# there is no weak option for a client to be steered into.
ssl_prefer_server_ciphers off;

# X25519 first: fastest and most widely implemented modern curve.
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# Session resumption cuts handshake cost for chatty SDK clients that open a new
# connection per request. Tickets are OFF because ticket keys are long-lived
# symmetric secrets on disk that undermine forward secrecy if the VPS is
# compromised (§16 threat: single VPS, see docs/security.md RESIDUAL RISK).
ssl_session_cache shared:BosandaTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling so clients do not make a third-party round trip mid-handshake.
# Requires ssl_trusted_certificate (certbot's chain.pem) set per server block.
ssl_stapling on;
ssl_stapling_verify on;

# Resolver used only for OCSP fetches. 127.0.0.53 is systemd-resolved on Ubuntu.
# If systemd-resolved is disabled on the VPS, replace with the VPS resolver;
# a wrong value makes stapling silently fail (handshake still works).
resolver 127.0.0.53 valid=300s;
resolver_timeout 5s;
