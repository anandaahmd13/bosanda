# Bosanda — common proxy headers for all three upstreams (PLAN.md §18)
#
# Included inside every `location` block that proxy_passes to a Node process.
# Install to /etc/nginx/snippets/bosanda-proxy-common.conf.

# HTTP/1.1 to the upstream is mandatory (§18). HTTP/1.0 has no chunked transfer
# encoding, and without chunked encoding an unbounded SSE stream cannot be
# expressed at all — nginx would have to buffer the whole response to compute a
# Content-Length, which is precisely the failure §18 is guarding against.
proxy_http_version 1.1;

# Clearing Connection is what actually enables the `keepalive` pools declared in
# conf.d/00-bosanda-http.conf. nginx defaults to sending `Connection: close` to
# the upstream, which closes the socket after every response and makes the
# keepalive directive dead configuration.
#
# WHY NOT the usual $connection_upgrade map: that map exists to pass WebSocket
# upgrades through, and it emits `Connection: close` for ordinary requests —
# silently defeating keepalive on every request Bosanda actually serves. Bosanda
# v1 has no WebSocket surface (§8 lists only JSON and SSE endpoints), so the
# correct value here is the empty string. If a WS endpoint is ever added, give it
# its own location with the upgrade map rather than degrading every other route.
proxy_set_header Connection "";

# Host must be the client-visible host: Next generates absolute URLs from it and
# the gateway records it for audit. $host is already normalized (no port).
proxy_set_header Host $host;

# Real client IP. The gateway's rate limiter keys on the API key, not the IP
# (§7), but audit rows and abuse investigation need the true source.
# $proxy_add_x_forwarded_for appends rather than overwrites.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# The hop to 127.0.0.1 is plain HTTP, so without these the Node apps believe the
# request arrived over http:// — Next emits http:// absolute URLs and cookies
# marked Secure get dropped as inconsistent with the perceived scheme.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# WHY strip this: X-Accel-Buffering from a CLIENT would let a caller dictate our
# buffering behaviour. nginx overwrites the forwarded headers it sets above, but
# any header we do not explicitly set passes through untouched. Empty string
# removes it, so only the GATEWAY's own X-Accel-Buffering: no (§18) is honoured.
proxy_set_header X-Accel-Buffering "";

# Do not let a raw upstream error page reach a client (§16). The Node apps return
# sanitized envelopes (BosandaError.publicMessage only), so this covers the case
# where Node dies mid-request and nginx would otherwise surface a 502 page that
# names the upstream address.
proxy_intercept_errors off;
proxy_hide_header X-Powered-By;
