# Bosanda — security response headers (PLAN.md §16)
#
# CSP is deliberately NOT here: it differs per vhost (the two Next apps need a
# nonce, the JSON API needs none) and lives in each server block instead.
#
# IMPORTANT nginx semantics: add_header does NOT merge across levels. If a
# `location` block declares any add_header of its own, EVERY inherited
# add_header from server/http level is dropped in that location. So any
# location that adds a header must re-include this snippet. The vhosts below
# are written to keep add_header at exactly one level per response path.

# HSTS: 2 years, subdomains included, preload-eligible.
# WHY includeSubDomains matters here: admin.bosanda.dev and api.bosanda.dev are
# subdomains of the apex, so one HSTS policy on bosanda.dev protects all three
# against SSL-strip on first contact.
# WARNING for the owner: `preload` is a one-way door. Once bosanda.dev is in the
# browser preload list, every present and future subdomain MUST serve valid TLS
# or become unreachable. Do not submit to hstspreload.org until all three
# domains have stable certificates. Drop the `preload` token if unsure.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Stop MIME sniffing. Without this a JSON error body or an uploaded blob can be
# reinterpreted as HTML/JS by a browser and executed same-origin.
add_header X-Content-Type-Options "nosniff" always;

# Referrer-Policy: never leak a Bosanda path (which can contain an order id or
# key id) to a third-party origin. same-origin sends a referrer only internally.
add_header Referrer-Policy "same-origin" always;

# Legacy clickjacking control for browsers that predate frame-ancestors.
# frame-ancestors in the per-vhost CSP is the authoritative modern control.
add_header X-Frame-Options "DENY" always;

# Turn off browser capabilities Bosanda never uses. Reduces the blast radius of
# an XSS to "cannot silently reach the camera, mic, or location".
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

# Cross-origin isolation. Keeps other origins from referencing our windows and
# from reading our resources into their documents.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Hide the nginx minor version from the Server header (§16: do not volunteer
# internal identity). Requires the full token removal below in http{} context;
# server_tokens off is set in each server block for clarity.
