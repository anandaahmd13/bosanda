# api.bosanda.dev — Fastify gateway, OpenAI- and Anthropic-compatible surfaces.
# PLAN.md §18 ("Nginx gateway location must preserve streaming"), §16, §17.
#
# This is the vhost where a wrong directive is not a style problem but a broken
# product: if nginx buffers, Claude Code and the OpenAI SDK sit silently until
# the whole turn finishes, and the streaming feature Bosanda sells does not work.

# --- Edge rate limiting (defence in depth, PLAN.md §16) ---------------------
#
# The AUTHORITATIVE limits live in the gateway, keyed on the API key: 100 RPM and
# 5 concurrent per key (§7, KEY_MAX_REQUESTS_PER_MINUTE / KEY_MAX_ACTIVE_REQUESTS).
# nginx cannot see the API key without parsing Authorization, and we do not want
# key material in nginx's memory or logs, so the edge limits by IP only.
#
# Therefore these numbers are deliberately LOOSER than the per-key limits. Their
# job is to blunt an unauthenticated flood before it reaches Node, not to enforce
# the product limit. A legitimate customer must never hit them first.
#
# 300 r/m ~= 5 r/s sustained. burst=120 with nodelay absorbs a client that opens
# many streams at once (Claude Code fans out) without delaying any of them:
# delaying a streaming request would look like a hang.
limit_req_zone $binary_remote_addr zone=api_req:10m rate=300r/m;

# Long-lived streams are CONNECTIONS, not requests, so a connection cap is the
# one that could actually break streaming. 60 concurrent per IP is far above the
# 5-per-key product limit but stops a single host exhausting worker slots.
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# Auth endpoints get their own tighter bucket (§12: "Login, registration, and
# recovery endpoints are rate-limited"). Applied in the location below.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;

# --- HTTP: redirect everything except the ACME challenge -------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.bosanda.dev;

    # certbot webroot renewal must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.bosanda.dev;

    # OWNER ACTION: these paths exist only after certbot has issued the cert.
    ssl_certificate     /etc/letsencrypt/live/api.bosanda.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bosanda.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.bosanda.dev/chain.pem;
    include /etc/nginx/snippets/bosanda-tls.conf;
    include /etc/nginx/snippets/bosanda-security-headers.conf;

    # CSP for an API origin: this host serves JSON and SSE, never HTML or script.
    # So the correct policy is "nothing is allowed to load at all". If a browser
    # is ever tricked into rendering an API response as a document, there is
    # nothing it may fetch or execute. No unsafe-inline anywhere.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # §16: body size limit. MUST equal LIMITS.maxBodyBytes = 8 * 1024 * 1024
    # (packages/protocol/src/limits.ts). Keeping these equal means an oversized
    # body is rejected identically at both layers; if nginx were smaller the
    # gateway's own 400 (invalid_request) would never fire and the client would
    # get nginx's HTML 413 instead of a protocol-shaped error.
    client_max_body_size 8m;

    # Buffer the request body to memory up to this size before spilling to disk.
    # Requests here are JSON up to 8 MB; spilling large bodies to disk on a small
    # VPS is slower than holding them.
    client_body_buffer_size 1m;

    # Slowloris protection: a client gets 15s to send headers and body. This is
    # about the REQUEST, which is always small and fast; it is unrelated to how
    # long the response may stream.
    client_header_timeout 15s;
    client_body_timeout 15s;

    limit_conn api_conn 60;

    # The `bosanda` JSON format is defined in conf.d/00-bosanda-http.conf and
    # deliberately omits Authorization, x-api-key, Cookie, and the query string
    # (§16 privacy). Buffered so a long turn does not end with a synchronous
    # disk write.
    access_log /var/log/nginx/api.bosanda.dev.access.log bosanda buffer=64k flush=5s;
    error_log  /var/log/nginx/api.bosanda.dev.error.log warn;

    # Health probe for scripts/healthcheck.sh. Not rate limited and not logged:
    # it runs every minute and would otherwise dominate the access log.
    location = /health {
        access_log off;
        limit_req_status 429;
        proxy_pass http://bosanda_gateway;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;
        proxy_read_timeout 5s;
    }

    # Metrics (§17) are operator-only. The gateway exposes Prometheus text on the
    # same port; it must NOT be world-readable, so deny at the edge and reach it
    # over the loopback/SSH tunnel instead.
    location = /metrics {
        deny all;
        access_log off;
    }

    # Tighter bucket for credential-handling endpoints (§12).
    location ~ ^/v1/(auth|login|register)(/|$) {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://bosanda_gateway;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # --- The streaming surface ---------------------------------------------
    location / {
        limit_req zone=api_req burst=120 nodelay;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://bosanda_gateway;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;

        # THE critical directive (§18). With buffering ON, nginx accumulates the
        # upstream response and forwards it in proxy_buffer_size chunks, so SSE
        # deltas arrive in batches or not until completion. Off = each write from
        # the gateway goes straight to the socket.
        proxy_buffering off;

        # Same hazard in the other direction: request_buffering off streams the
        # request body upstream instead of waiting for all 8 MB, which lowers
        # time-to-first-token on large histories.
        proxy_request_buffering off;

        # Never cache a token stream. Redundant with proxy_buffering off, but a
        # future `proxy_cache_path` at http{} level would otherwise apply here.
        proxy_cache off;

        # gzip re-introduces buffering: the compressor needs a block of input
        # before it emits anything, which reintroduces exactly the latency
        # proxy_buffering off just removed. §18 requires it off.
        gzip off;

        # Belt and braces for the SSE contract. The gateway already sends
        # X-Accel-Buffering: no (§18) — which nginx honours by disabling
        # buffering for that response — but setting the response headers here
        # means a bug in the gateway cannot cause a buffered, cached stream.
        #
        # MUST re-declare the inherited headers below. Adding ANY add_header in a
        # location discards the entire inherited add_header set, so without these
        # re-includes the main API surface — the most security-sensitive path on
        # the box — would serve responses with no HSTS, no nosniff, and no CSP.
        include /etc/nginx/snippets/bosanda-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;
        proxy_set_header Accept-Encoding "";

        # Chunked transfer: HTTP/1.1 + no Content-Length is what makes an
        # unbounded stream expressible. Explicitly clear any inherited
        # chunked_transfer_encoding off.
        chunked_transfer_encoding on;

        # Timeouts, asymmetric on purpose (§18 uses 600s):
        #  - connect stays SHORT. If the local gateway is not accepting, we want
        #    a fast 502 and a fast failover, not a 10-minute wait.
        #  - read/send are GENEROUS, matching UPSTREAM_HARD_TIMEOUT_MS=600000.
        #    proxy_read_timeout is the gap allowed BETWEEN reads, not the total
        #    duration, so a long turn that keeps emitting deltas never trips it.
        #    The real per-turn bounds are enforced in the gateway
        #    (UPSTREAM_IDLE_TIMEOUT_MS / UPSTREAM_HARD_TIMEOUT_MS), because only
        #    the gateway can distinguish "idle upstream" from "slow client".
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Let the client abort propagate. The gateway turns a dropped connection
        # into an AbortSignal that cancels the upstream fetch (§3 G2), which
        # stops burning provider credit. Default (off) is what we want; stated
        # explicitly because setting it on would silently break cancellation.
        proxy_ignore_client_abort off;
    }
}
