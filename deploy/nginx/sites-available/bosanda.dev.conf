# bosanda.dev — Next.js storefront (PLAN.md §18, §16).
#
# Public, unauthenticated browsing plus authenticated checkout and the customer
# dashboard (key reveal, quota, expiry). No streaming here, so unlike the API
# vhost this one WANTS buffering, compression, and static asset caching.

limit_req_zone $binary_remote_addr zone=web_req:10m rate=600r/m;

# §12: "Login, registration, and recovery endpoints are rate-limited." The Next
# app posts these as server actions / route handlers under /api and /login.
limit_req_zone $binary_remote_addr zone=web_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bosanda.dev www.bosanda.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bosanda.dev$request_uri;
    }
}

# Fold www into the apex on HTTPS so cookies have exactly one origin. Session
# cookies are host-only; serving both hosts would create two session domains.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bosanda.dev;

    ssl_certificate     /etc/letsencrypt/live/bosanda.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosanda.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bosanda.dev/chain.pem;
    include /etc/nginx/snippets/bosanda-tls.conf;

    return 301 https://bosanda.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bosanda.dev;

    # OWNER ACTION: issued by certbot; absent until then.
    ssl_certificate     /etc/letsencrypt/live/bosanda.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosanda.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bosanda.dev/chain.pem;
    include /etc/nginx/snippets/bosanda-tls.conf;
    include /etc/nginx/snippets/bosanda-security-headers.conf;

    # --- CSP (PLAN.md §16) --------------------------------------------------
    #
    # No 'unsafe-inline' for script-src. Next.js 16 App Router emits inline
    # <script> tags for streaming hydration payloads (self.__next_f.push(...)),
    # so a nonce-free strict policy WILL break hydration. Two options:
    #
    #  (a) NONCE WIRING (what this policy assumes). Next reads the nonce from the
    #      incoming CSP header and stamps it onto every script tag it generates.
    #      Requirement: apps/web must set the nonce in middleware, per request,
    #      from a CSPRNG — NOT here, because nginx cannot generate a fresh random
    #      value per request without a third-party module. That means the nonce
    #      in the CSP header must also come from the app, so the app owns the
    #      whole header on HTML responses and nginx must not duplicate it.
    #
    #  (b) 'strict-dynamic' + hashes, which Next does not fully support for its
    #      hydration inline scripts today.
    #
    # Consequence, stated plainly: the header below is the FALLBACK for responses
    # the app did not set a CSP on (static assets, nginx's own error pages).
    # Because add_header does not overwrite an upstream header of the same name,
    # if apps/web sends its own Content-Security-Policy the client receives BOTH,
    # and browsers enforce the INTERSECTION — which would break the nonce policy.
    #
    # OWNER ACTION REQUIRED, pick one and do it before launch:
    #   1. apps/web owns CSP: delete the add_header line below.
    #   2. nginx owns CSP: apps/web must not send the header, and you accept
    #      'unsafe-inline' for script-src (weaker; not recommended).
    # This is NOT verified — no Next app was built or served during this work.
    #
    # object-src 'none' and base-uri 'none' block plugin and <base> hijacking.
    # frame-ancestors 'none' is the modern X-Frame-Options: DENY.
    # form-action 'self' https://pakasir.com allows the checkout hand-off (§13).
    # connect-src includes the API origin so the dashboard may call it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.bosanda.dev; form-action 'self' https://pakasir.com; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Storefront bodies are form posts and JSON, never 8 MB. A small limit here
    # is not the API limit and does not contradict LIMITS.maxBodyBytes: nothing
    # on this host accepts a model request.
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;

    # `bosanda` JSON format from conf.d/00-bosanda-http.conf; omits credentials
    # and the query string by construction (§16 privacy).
    access_log /var/log/nginx/bosanda.dev.access.log bosanda buffer=32k flush=5s;
    error_log  /var/log/nginx/bosanda.dev.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Next's immutable build assets are content-hashed, so they can be cached
    # hard and forever. This is the single biggest win for repeat visitors.
    location /_next/static/ {
        proxy_pass http://bosanda_web;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;
        # Re-include: this location declares add_header, which discards the whole
        # inherited add_header set (HSTS, nosniff, CSP...). Static JS is exactly
        # where a missing nosniff or CSP matters, so restore them explicitly.
        include /etc/nginx/snippets/bosanda-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Auth and mutation endpoints (§12).
    location ~ ^/(login|register|logout|api/auth)(/|$) {
        limit_req zone=web_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://bosanda_web;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=web_req burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://bosanda_web;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;

        # Buffering ON here (the default): it shortens how long a Node worker is
        # tied to a slow mobile client. The opposite of the API vhost, and that
        # asymmetry is the point.
        proxy_buffering on;
        proxy_buffers 16 16k;

        # Next server-renders and streams RSC payloads, but a page render is
        # seconds, not minutes. Short timeouts surface a hung render quickly.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
