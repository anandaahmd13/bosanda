# admin.bosanda.dev — Next.js admin dashboard (PLAN.md §15, §16, §18).
#
# Highest-value target on the box: it can set passwords, revoke keys, adjust
# stock, and read the quota ledger. Hardened beyond the storefront, and
# deliberately hostile to anything that is not a logged-in operator browser.

# Only a handful of operators ever use this host, so the edge limit can be tight
# without any risk of blocking legitimate traffic.
limit_req_zone $binary_remote_addr zone=admin_req:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.bosanda.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.bosanda.dev;

    ssl_certificate     /etc/letsencrypt/live/admin.bosanda.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bosanda.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.bosanda.dev/chain.pem;
    include /etc/nginx/snippets/bosanda-tls.conf;
    include /etc/nginx/snippets/bosanda-security-headers.conf;

    # ------------------------------------------------------------------------
    # IP ALLOWLIST GOES HERE (PLAN.md §16: "Admin dashboard may be protected by
    # an additional IP allowlist or VPN").
    #
    # This is the single highest-value control on this vhost and it is left
    # DISABLED because a wrong value locks the owner out of their own admin
    # panel from a dynamic-IP home connection, with no second channel to recover
    # (there is no email in v1 — see docs/security.md RESIDUAL RISK).
    #
    # OWNER ACTION: uncomment, set your real addresses, then `nginx -t` and
    # reload. Test from a phone on mobile data BEFORE closing your SSH session,
    # and keep that session open until you have confirmed you can still log in.
    #
    #   allow 203.0.113.4;       # office static IP
    #   allow 198.51.100.0/24;   # VPN egress range
    #   deny  all;
    #
    # Preferred alternative: bind admin to a WireGuard interface only and do not
    # expose it on the public interface at all. Then this vhost's `listen` lines
    # become `listen 10.8.0.1:443 ssl;` and the allowlist is unnecessary.
    # ------------------------------------------------------------------------

    # Admin CSP is stricter than the storefront: no third-party form targets at
    # all (there is no payment hand-off here) and no data: images.
    # The SAME Next.js nonce caveat as bosanda.dev applies — see the long comment
    # in bosanda.dev.conf. Do not let both nginx and apps/admin send this header.
    # NOT VERIFIED: no admin app was built or served during this work.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Admin must never be indexed or cached by an intermediary. Every response
    # here is operator-specific.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;

    # `bosanda` JSON format from conf.d/00-bosanda-http.conf. Admin access logs
    # are the audit trail for operator actions, so they are NOT buffered as
    # aggressively as the storefront: a crash should lose at most a second of
    # operator history.
    access_log /var/log/nginx/admin.bosanda.dev.access.log bosanda flush=1s;
    error_log  /var/log/nginx/admin.bosanda.dev.error.log warn;

    # Deny the crawler politely as well as via header.
    # add_header here drops the inherited set, but this response is a two-line
    # text/plain literal with no script, no cookie, and no user data, so the loss
    # is harmless. Re-included anyway to keep one rule ("every add_header location
    # re-includes") rather than a rule with exceptions to remember.
    location = /robots.txt {
        include /etc/nginx/snippets/bosanda-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /_next/static/ {
        proxy_pass http://bosanda_admin;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;
        # Re-include: declaring add_header discards every inherited header.
        include /etc/nginx/snippets/bosanda-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Admin login is the credential-stuffing target. Tightest bucket on the box.
    location ~ ^/(login|api/auth)(/|$) {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bosanda_admin;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=admin_req burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://bosanda_admin;
        include /etc/nginx/snippets/bosanda-proxy-common.conf;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_connect_timeout 5s;

        # Some admin views aggregate the ledger and can be slow. 120s is generous
        # for a report without being an open-ended hang.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
